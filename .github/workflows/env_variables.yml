name: env_variables_aritfacts_secreats
on:
  push:
    branches:
      - main
      - 'feat*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@v4
      - name: install_node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: add_cache
        uses: actions/cache@v4
        with:
          path: ~/.json
          key: "${{hashFiles('package-lock.json')}}"
      - name: add_dependencies
        run: npm ci
      - name: run_test
        run: npm run test
  build:
    needs: test
    outputs:
      my_var: ${{steps.var_id1.outputs.output_var}}
    runs-on: ubuntu-latest
    steps:
      - name: get_code
        uses: actions/checkout@v4
      - name: add_cache
        uses: actions/cache@v4
        with:
          path: ~/.json
          key: "${{hashFiles('package-lock.json')}}"
      - name: install_dependies_build
        run: npm ci
      - name: build_code
        run: npm run build
      - name: upload_artifacts
        uses: actions/upload-artifact@v4
        with: 
          path: dist
      - name: set_variable
        id: var_id1
        run: find dist/assets/*.json f -execdir echo 'output_var={}' $GITHUB_OUTPUT ';'
  deployment:
    needs: build
    runs-on: ubutu-latest
    steps:
      - name: download_artifacts
        uses: actions/download-artifact@v4
      - name: list_files
        run: ls
      - name: print_variable
        run: echo "variable_output=${{needs.build.my_var}}"
      - name: print_secrents and varialbes
        run: |
          echo "MONGODB_USERNAME: ${{secrets.MONGODB_USERNAME}}"
          echo "MONGODB_PASSWORD: ${{secrets.MONGODB_PASSWORD}}"
          echo "OWNER_Name: ${{vars.OWNER}}"



